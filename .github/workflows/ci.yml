name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The OpenMAIC commit the on-device patch is validated against. Bump this
  # together with patches/openmaic/openmaic-offline-on-device.patch.
  OPENMAIC_BASE: f6cf8fd4b74ac83ea969e88b6dc2c974931b4d65

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shell scripts parse
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done
          echo "bash -n OK"

      - name: Eval scripts import and expose CLI
        run: |
          python3 -m py_compile eval/*.py
          python3 eval/slide_eval.py --help > /dev/null
          python3 eval/html_eval.py --help > /dev/null
          echo "py OK"

      - name: Sample data files parse
        run: |
          python3 - <<'EOF'
          import json, glob
          for path in sorted(glob.glob("eval/samples/*.jsonl")):
              rows = [json.loads(l) for l in open(path)]
              assert rows, f"{path} is empty"
              print(f"{path}: {len(rows)} rows OK")
          EOF

      - name: OpenMAIC patch applies to the pinned upstream commit
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet https://github.com/THU-MAIC/OpenMAIC.git openmaic
          git -C openmaic checkout --quiet "$OPENMAIC_BASE"
          git -C openmaic apply --check "$GITHUB_WORKSPACE/patches/openmaic/openmaic-offline-on-device.patch"
          git -C openmaic apply --stat "$GITHUB_WORKSPACE/patches/openmaic/openmaic-offline-on-device.patch" | tail -2
          echo "patch applies cleanly to $OPENMAIC_BASE"

      - name: llama.cpp patch note references a real file path
        run: |
          grep -q "ggml-metal-context.m" patches/llama-cpp/macos13-metal-buffer-fix.md
          echo "llama.cpp patch note OK"
